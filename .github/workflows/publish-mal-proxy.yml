name: Publish MAL Proxy image

on:
  push:
    branches:
      - main
    paths:
      - "mal-proxy/**"
      - ".github/workflows/publish-mal-proxy.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./mal-proxy
          file: ./mal-proxy/Dockerfile
          push: true
          tags: |
            ghcr.io/max2000777/mal-proxy:latest